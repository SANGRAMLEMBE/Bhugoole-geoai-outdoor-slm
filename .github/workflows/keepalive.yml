# Health check of the live endpoint every 3 hours during judging. A failed run means the API did not answer,
# and GitHub emails the repository owner. Override the URL with the repository variable ENDPOINT_URL if it changes.
name: endpoint-health
on:
  schedule: [{cron: "17 */3 * * *"}]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          url="${{ vars.ENDPOINT_URL || 'https://sangramlembe9696--bhugoole-geoai-web.us-east.modal.run' }}"
          curl -fsS --retry 2 --max-time 120 "$url/health"
